_config_version: 33
compression:
  enabled: true
  threshold: 0.85
cron:
  wrap_response: false
custom_providers:
  - base_url: https://gorouter.app/v1
    key_env: HERMES_CUSTOM_GOROUTER_APP_API_KEY
    model: claude-opus-5-thinking
    models:
      claude-opus-5-thinking:
        context_length: 1000000
    name: gorouter.app
  - base_url: https://opencode.ai/zen/go/v1
    key_env: HERMES_CUSTOM_OPENCODE_AI_API_KEY
    model: mimo-v2.5
    models:
      mimo-v2.5:
        context_length: 1000000
    name: Opencode.ai
  - base_url: https://api.agentrouter.org/v1
    key_env: AGENT_ROUTER_TOKEN
    model: geminiM
    models:
      geminiM:
        context_length: 1000000
      Qwen: '{"context_length": 32768}'
    name: AgentRouter
mcp_servers:
  exa:
    enabled: true
    headers:
      Authorization: Bearer ${MCP_EXA_API_KEY}
    url: https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa,web_search_advanced_exa,agent_run
  ticktick:
    enabled: true
    headers:
      Authorization: Bearer ${MCP_TICKTICK_API_KEY}
    url: https://mcp.ticktick.com
model:
  default: geminiM
  provider: custom
onboarding:
  seen:
    busy_input_prompt: true
    profile_build_offered: true
platforms:
  telegram:
    enabled: true
    home_channel:
      chat_id: '52615254'
      name: ɢɦ
      platform: telegram
      user_id: '52615254'
terminal:
  backend: local
  cwd: /data/workspace
  timeout: 180
