model:
  default: mimo-v2.5
  provider: custom
  base_url: https://opencode.ai/zen/go/v1
  api_key: ${HERMES_CUSTOM_OPENCODE_AI_API_KEY}
terminal:
  backend: local
  cwd: /data/workspace
  timeout: 180
compression:
  enabled: true
  threshold: 0.85
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
_config_version: 33
platforms:
  telegram:
    enabled: true
    home_channel:
      platform: telegram
      chat_id: '52615254'
      name: ɢɦ
      user_id: '52615254'
custom_providers:
  - name: gorouter.app
    base_url: https://gorouter.app/v1
    key_env: HERMES_CUSTOM_GOROUTER_APP_API_KEY
    model: claude-opus-5-thinking
    models:
      claude-opus-5-thinking:
        context_length: 1000000
  - name: Opencode.ai
    base_url: https://opencode.ai/zen/go/v1
    key_env: HERMES_CUSTOM_OPENCODE_AI_API_KEY
    model: mimo-v2.5
    models:
      mimo-v2.5:
        context_length: 1000000
mcp_servers:
  exa:
    url: https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa,web_search_advanced_exa,agent_run
    headers:
      Authorization: Bearer ${MCP_EXA_API_KEY}
    enabled: true
cron:
  wrap_response: false
